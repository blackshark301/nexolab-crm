<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexoLab CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
input,textarea,select{-webkit-appearance:none;appearance:none;background-color:rgba(4,8,20,0.98)!important;color:#c8d4ee!important}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px rgba(4,8,20,0.98) inset!important;-webkit-text-fill-color:#c8d4ee!important;caret-color:#c8d4ee!important}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(79,124,255,0.3),0 0 20px rgba(79,124,255,0.08)}50%{box-shadow:0 0 0 1px rgba(79,124,255,0.7),0 0 30px rgba(79,124,255,0.2)}}

html,body{min-height:100vh;background:#04080f;font-family:system-ui,-apple-system,sans-serif}
.app{position:relative;min-height:100vh;background:#04080f;overflow-x:hidden}
.bg-grad{position:fixed;inset:0;background:radial-gradient(ellipse at 15% 50%,rgba(43,91,245,0.16) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(193,53,132,0.1) 0%,transparent 50%),radial-gradient(ellipse at 60% 85%,rgba(28,200,138,0.07) 0%,transparent 45%),#04080f;pointer-events:none;z-index:0}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(79,124,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(79,124,255,0.035) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
.orb1{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(43,91,245,0.13) 0%,transparent 70%);top:-120px;left:-120px;animation:pulse 5s ease-in-out infinite;pointer-events:none;z-index:0}
.orb2{position:fixed;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(193,53,132,0.1) 0%,transparent 70%);bottom:-80px;right:-80px;animation:pulse 5s ease-in-out infinite 2.5s;pointer-events:none;z-index:0}

/* LOGIN */
.login-screen{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-box{width:100%;max-width:420px;animation:fadeIn .5s ease}
.logo-ring{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,rgba(43,91,245,0.2),rgba(79,124,255,0.08));border:1px solid rgba(79,124,255,0.28);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;animation:glow 3s ease-in-out infinite}
.logo-ring i{font-size:28px;color:#4F7CFF}
.logo-txt{font-size:30px;font-weight:800;letter-spacing:4px;color:#fff;text-align:center}
.logo-x{background:linear-gradient(135deg,#2B5BF5,#7BBDFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:10px;color:#3a4f6a;letter-spacing:3.5px;text-transform:uppercase;margin-top:7px;text-align:center;margin-bottom:2rem}
.glass{background:rgba(10,18,34,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(79,124,255,0.13);border-radius:20px;padding:2rem;position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(79,124,255,0.45),transparent)}
.glass::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(79,124,255,0.12),transparent)}
.g-title{font-size:17px;font-weight:700;color:#dde6ff;margin-bottom:3px}
.g-sub{font-size:13px;color:#4a6080;margin-bottom:1.6rem}
.f-label{font-size:10px;font-weight:700;color:#5a7090;letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:5px}
.f-wrap{position:relative;margin-bottom:1.1rem}
.f-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#2a3d56;font-size:15px;pointer-events:none;z-index:2}
.f-inp{width:100%;background:rgba(3,6,16,0.98)!important;border:1px solid rgba(35,50,76,0.8);border-radius:11px;padding:12px 13px 12px 40px;font-size:14px;color:#c8d4ee!important;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-text-fill-color:#c8d4ee!important}
.f-inp:focus{border-color:rgba(79,124,255,0.55);box-shadow:0 0 0 3px rgba(79,124,255,0.07)}
.f-inp::placeholder{color:#151f30;-webkit-text-fill-color:#151f30!important}
.f-sel{width:100%;background:rgba(3,6,16,0.98)!important;border:1px solid rgba(35,50,76,0.8);border-radius:11px;padding:12px;font-size:14px;color:#c8d4ee!important;outline:none}
.f-ta{width:100%;background:rgba(3,6,16,0.98)!important;border:1px solid rgba(35,50,76,0.8);border-radius:11px;padding:10px 12px;font-size:13px;color:#c8d4ee!important;outline:none;resize:none;-webkit-text-fill-color:#c8d4ee!important}
.f-ta:focus,.f-inp:focus{border-color:rgba(79,124,255,0.55)}
.nx-err{font-size:12px;color:#d94f4f;min-height:14px;margin-bottom:6px}
.hint{font-size:11px;color:#2a3d56;text-align:center;margin-top:1.1rem}
.hint span{color:#4F7CFF;font-weight:600}
.dots{display:flex;justify-content:center;gap:5px;margin-top:1.4rem}
.dot{width:4px;height:4px;border-radius:50%;background:#151f30}
.dot.a{background:#4F7CFF;width:18px;border-radius:2px}

/* MAIN */
.main-screen{display:none;position:relative;z-index:2;min-height:100vh;max-width:900px;margin:0 auto;padding:1.5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid rgba(35,50,76,0.5)}
.t-logo{font-size:16px;font-weight:800;letter-spacing:2px;color:#fff}
.t-logo span{background:linear-gradient(135deg,#2B5BF5,#7BBDFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.t-sub{font-size:11px;color:#3a4f6a;margin-top:1px}
.main-nav{display:flex;gap:6px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid rgba(35,50,76,0.35);overflow-x:auto}
.proj-bar{display:flex;gap:5px;margin-bottom:1.1rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subnav{display:flex;gap:5px;margin-bottom:1.1rem;flex-wrap:wrap}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:1rem}
.kpi{background:rgba(10,18,34,0.55);border:1px solid rgba(35,50,76,0.5);border-radius:12px;padding:.8rem;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(79,124,255,0.25),transparent)}
.kpi-lbl{font-size:9px;color:#4a6080;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:3px}
.kpi-val{font-size:20px;font-weight:800}

.sec{font-size:9px;font-weight:700;color:#3a4f6a;text-transform:uppercase;letter-spacing:2px;margin-bottom:.6rem}
.card{background:rgba(10,18,34,0.5);border:1px solid rgba(35,50,76,0.4);border-radius:13px;overflow:hidden;margin-bottom:.85rem}
.card-p{padding:1rem 1.1rem}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid rgba(14,24,42,0.9);cursor:pointer;transition:background .15s}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:rgba(79,124,255,0.045)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.li{flex:1;min-width:0}
.ln{font-size:13px;font-weight:600;color:#c8d4ee}
.ls{font-size:11px;color:#2a3d56;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;flex-shrink:0}
.empty{text-align:center;padding:2rem;color:#1a2840;font-size:13px}

.pcard{background:rgba(10,18,34,0.58);border:1px solid rgba(35,50,76,0.45);border-radius:14px;padding:1rem 1.1rem 1rem 1.4rem;margin-bottom:.75rem;cursor:pointer;transition:border-color .2s,background .2s;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(79,124,255,0.12),transparent)}
.pcard:hover{background:rgba(79,124,255,0.04);border-color:rgba(79,124,255,0.22)}
.pcard-stripe{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:14px 0 0 14px}
.pcard-title{font-size:14px;font-weight:700;color:#c8d4ee;margin-bottom:3px}
.pcard-sub{font-size:11px;color:#2a3d56}
.prog-bar{height:4px;border-radius:99px;background:rgba(35,50,76,0.5);overflow:hidden;margin:7px 0}
.prog-fill{height:100%;border-radius:99px}

.task{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid rgba(14,24,42,0.7);font-size:13px}
.task:last-child{border-bottom:none}
.chk{width:17px;height:17px;border-radius:5px;border:1px solid rgba(35,50,76,0.8);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.chk.done{background:linear-gradient(135deg,#2B5BF5,#4F7CFF);border-color:#4F7CFF}
.task-txt{flex:1;color:#b8c8e2}
.task-txt.done{color:#2a3d56;text-decoration:line-through}

.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-hd{font-size:9px;font-weight:700;color:#1a2840;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{border-radius:7px;padding:3px 1px;text-align:center;cursor:pointer;min-height:40px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s}
.cal-day:hover{background:rgba(79,124,255,0.07)}
.cal-num{font-size:11px;font-weight:600;color:#4a6080}
.cal-day.today .cal-num{color:#4F7CFF;font-weight:800}
.cal-dot{width:5px;height:5px;border-radius:50%}

.file-item{display:flex;align-items:center;gap:9px;padding:8px 10px;background:rgba(3,6,16,0.55);border:1px solid rgba(35,50,76,0.4);border-radius:9px;margin-bottom:5px}
.file-ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-nm{font-size:12px;font-weight:600;color:#b8c8e2}
.file-sz{font-size:10px;color:#2a3d56}
.upload-zone{border:2px dashed rgba(35,50,76,0.55);border-radius:11px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:.75rem}
.upload-zone:hover{border-color:rgba(79,124,255,0.35);background:rgba(79,124,255,0.025)}
.upload-ico{font-size:28px;color:#2a3d56;margin-bottom:6px}
.upload-txt{font-size:12px;color:#2a3d56}
.upload-txt span{color:#4F7CFF;font-weight:600}

.note-box{background:rgba(3,6,16,0.75);border:1px solid rgba(35,50,76,0.45);border-radius:8px;padding:7px 10px;font-size:12px;color:#4a6080;margin-bottom:5px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.today-item{padding:9px 13px;border-bottom:1px solid rgba(14,24,42,0.7);display:flex;align-items:center;gap:9px}
.today-item:last-child{border-bottom:none}
.today-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* MODALS */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(1,3,9,0.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);align-items:flex-start;justify-content:center;padding:1rem;z-index:100;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:rgba(6,12,24,0.99);border:1px solid rgba(79,124,255,0.18);border-radius:20px;padding:1.5rem;width:100%;max-width:520px;position:relative;margin-top:2rem;overflow:hidden}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(79,124,255,0.55),transparent)}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.1rem}
.modal-title{font-size:15px;font-weight:700;color:#dde6ff}
.modal-sub{font-size:11px;color:#2a3d56;margin-top:2px}
.tab-bar{display:flex;gap:0;margin-bottom:1.1rem;border-bottom:1px solid rgba(35,50,76,0.45);overflow-x:auto}
.ptab{padding:7px 13px;font-size:11px;font-weight:700;color:#4a6080;cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;transition:color .15s;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.ptab.active{color:#4F7CFF;border-bottom-color:#4F7CFF}
.drow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(14,24,42,0.8);font-size:13px}
.drow:last-child{border-bottom:none}
.drow-lbl{color:#2a3d56}
.drow-val{color:#b8c8e2;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:rgba(10,18,34,0.95);border:1px solid rgba(79,124,255,0.3);border-radius:10px;padding:10px 16px;font-size:13px;color:#c8d4ee;z-index:200;animation:fadeIn .3s ease;display:none}
.toast.show{display:block}

/* RESPONSIVO */
@media(max-width:600px){
  .main-screen{padding:1rem}
  .grid2{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
<div class="bg-grad"></div>
<div class="grid-bg"></div>
<div class="orb1"></div>
<div class="orb2"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="login-screen" id="ls">
  <div class="login-box">
    <div class="logo-ring"><i class="ti ti-hexagon"></i></div>
    <div class="logo-txt">NE<span class="logo-x">X</span>OLAB</div>
    <div class="logo-sub">CRM · Projetos · Gestão</div>
    <div class="glass">
      <div class="g-title">Bem-vindo de volta</div>
      <div class="g-sub">Acesse sua central de operações</div>
      <label class="f-label">Usuário</label>
      <div class="f-wrap"><i class="ti ti-user"></i><input class="f-inp" type="text" id="iu" value="admin" autocomplete="off"></div>
      <label class="f-label">Senha</label>
      <div class="f-wrap"><i class="ti ti-lock"></i><input class="f-inp" type="password" id="ip" placeholder="••••••••" autocomplete="new-password"></div>
      <div class="nx-err" id="lerr"></div>
      <button id="btn-in">Entrar no sistema</button>
      <div class="hint">Credenciais configuradas no arquivo</div>
      <div class="dots"><div class="dot a"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main-screen" id="ms">
  <div class="topbar">
    <div><div class="t-logo">NE<span>X</span>OLAB</div><div class="t-sub" id="wtxt"></div></div>
    <button id="btn-out">SAIR</button>
  </div>
  <div class="main-nav">
    <button id="mn-crm">CRM / LEADS</button>
    <button id="mn-proj">PROJETOS ATIVOS</button>
    <button id="mn-hoje">HOJE</button>
  </div>

  <!-- CRM -->
  <div id="v-crm" style="display:none">
    <div class="proj-bar">
      <button id="pb-insta">INSTAGRAM</button>
      <button id="pb-video">VÍDEO & POSTS</button>
      <button id="pb-sites">SITES & LPs</button>
      <button id="pb-sistemas">SISTEMAS</button>
    </div>
    <div id="ph" style="margin-bottom:.9rem"></div>
    <div class="subnav">
      <button id="sb-dash">DASHBOARD</button>
      <button id="sb-leads">LEADS</button>
      <button id="sb-novo">+ NOVO LEAD</button>
      <button id="sb-prosp">PROSPECÇÃO</button>
    </div>
    <div id="t-dash">
      <div class="kpi-grid" id="kgrid"></div>
      <div class="grid2" style="margin-bottom:.85rem"><div class="kpi" id="kconv"></div><div class="kpi" id="krec"></div></div>
      <div class="sec">Leads recentes</div>
      <div class="card"><div id="rl"></div></div>
    </div>
    <div id="t-leads" style="display:none">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem">
        <button id="fl-todos">TODOS</button><button id="fl-novo">NOVOS</button><button id="fl-neg">NEGOCIANDO</button><button id="fl-fech">FECHADOS</button><button id="fl-perd">PERDIDOS</button>
      </div>
      <div class="f-wrap" style="margin-bottom:.75rem"><i class="ti ti-search"></i><input class="f-inp" id="busca" placeholder="Buscar por nome ou cidade..." oninput="rLeads()" autocomplete="off"></div>
      <div class="card"><div id="ll"></div></div>
    </div>
    <div id="t-novo" style="display:none">
      <div class="card card-p">
        <div class="sec" id="ftitle">NOVO LEAD</div>
        <div class="grid2">
          <div><label class="f-label">Nome</label><div class="f-wrap"><i class="ti ti-user"></i><input class="f-inp" id="fn" placeholder="Nome" autocomplete="off"></div></div>
          <div><label class="f-label">WhatsApp</label><div class="f-wrap"><i class="ti ti-brand-whatsapp"></i><input class="f-inp" id="fw" placeholder="(11) 99999-9999" autocomplete="off"></div></div>
        </div>
        <div class="grid2">
          <div><label class="f-label">E-mail</label><div class="f-wrap"><i class="ti ti-mail"></i><input class="f-inp" id="femail" placeholder="email@exemplo.com" autocomplete="off"></div></div>
          <div><label class="f-label">Instagram</label><div class="f-wrap"><i class="ti ti-brand-instagram"></i><input class="f-inp" id="finsta" placeholder="@perfil" autocomplete="off"></div></div>
        </div>
        <div class="grid2">
          <div><label class="f-label">Status</label><select class="f-sel" id="fst"><option value="Novo">Novo</option><option value="Negociando">Negociando</option><option value="Fechado">Fechado</option><option value="Perdido">Perdido</option></select></div>
          <div><label class="f-label">Valor (R$)</label><div class="f-wrap"><i class="ti ti-currency-dollar"></i><input class="f-inp" id="fv" type="number" placeholder="0" autocomplete="off"></div></div>
        </div>
        <label class="f-label">Cidade</label>
        <div class="f-wrap" style="margin-bottom:.9rem"><i class="ti ti-map-pin"></i><input class="f-inp" id="fc" placeholder="São Paulo" autocomplete="off"></div>
        <label class="f-label">Anotação</label>
        <textarea class="f-ta" id="fno" rows="2" placeholder="Observações..."></textarea>
        <div class="nx-err" id="ferr" style="margin-top:6px"></div>
        <button id="btn-salvar" style="margin-top:8px">SALVAR LEAD</button>
      </div>
    </div>
    <div id="t-prosp" style="display:none">
      <div class="card card-p" style="margin-bottom:.85rem">
        <div class="sec">BUSCAR NOVOS LEADS</div>
        <div style="display:flex;gap:8px;margin-bottom:.75rem;flex-wrap:wrap">
          <div class="f-wrap" style="flex:1;min-width:120px;margin:0"><i class="ti ti-map-pin"></i><input class="f-inp" id="p-cidade" placeholder="Cidade..." autocomplete="off"></div>
          <div class="f-wrap" style="flex:1;min-width:120px;margin:0"><i class="ti ti-briefcase"></i><input class="f-inp" id="p-nicho" placeholder="Nicho..." autocomplete="off"></div>
        </div>
        <div class="nx-err" id="prosp-err"></div>
        <button id="btn-buscar" style="margin-top:4px">BUSCAR LEADS</button>
      </div>
      <div id="res-wrap" style="display:none;margin-bottom:1.25rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
          <div class="sec" style="margin:0" id="res-titulo">Resultados</div>
          <div style="font-size:11px;color:#2a3d56" id="res-count"></div>
        </div>
        <div id="res-list"></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
          <div class="sec" style="margin:0">HISTÓRICO DE PROSPECÇÃO</div>
          <div style="font-size:11px;color:#2a3d56" id="hist-count"></div>
        </div>
        <div class="card"><div id="hist-list"></div></div>
      </div>
    </div>
  </div>

  <!-- PROJETOS -->
  <div id="v-proj" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem">
      <div class="sec" style="margin:0">PROJETOS EM ANDAMENTO</div>
      <button id="btn-np">+ NOVO PROJETO</button>
    </div>
    <div id="plist"></div>
  </div>

function rDash(){
  const list=leads[pAtivo],total=list.length,neg=list.filter(l=>l.status==='Negociando').length,fech=list.filter(l=>l.status==='Fechado').length,nov=list.filter(l=>l.status==='Novo').length;

  document.getElementById('kgrid').innerHTML=`<div class="kpi"><div class="kpi-lbl">Total</div><div class="kpi-val" style="color:${p.cor}">${total}</div></div><div class="kpi"><div class="kpi-lbl">Novos</div><div class="kpi-val" style="color:#4F7CFF">${nov}</div></div><div class="kpi"><div class="kpi-lbl">Negociando</div><div class="kpi-val" style="color:#F6C23E">${neg}</div></div><div class="kpi"><div class="kpi-lbl">Fechados</div><div class="kpi-val" style="color:#1CC88A">${fech}</div></div>`;

  const n=document.getElementById('fn').value.trim();const e=document.getElementById('ferr');
  if(!n){e.textContent='Informe o nome.';return;}e.textContent='';
  const lead={id:nLid++,nome:n,wa:document.getElementById('fw').value.trim(),email:document.getElementById('femail').value.trim(),insta:document.getElementById('finsta').value.trim(),cidade:document.getElementById('fc').value.trim(),status:document.getElementById('fst').value,valor:document.getElementById('fv').value||0,notas:document.getElementById('fno').value.trim()?[document.getElementById('fno').value.trim()]:[],data:td(),projeto:pAtivo,origem:'manual'};
  leads[pAtivo].unshift(lead);
  if(SUPABASE_OK)sb_client.from('leads').insert({nome:lead.nome,wa:lead.wa,email:lead.email,insta:lead.insta,cidade:lead.cidade,status:lead.status,valor:lead.valor,notas:lead.notas,projeto:pAtivo,origem:'manual'});
  toast('Lead salvo!');selS('dash');
}

// ============================================================
// PROSPECÇÃO
// ============================================================
function buscarLeads(){
  const cidade=document.getElementById('p-cidade').value.trim();const nicho=document.getElementById('p-nicho').value.trim();const err=document.getElementById('prosp-err');
  if(!cidade||!nicho){err.textContent='Preencha a cidade e o nicho.';return;}err.textContent='';
  document.getElementById('res-wrap').style.display='block';
  document.getElementById('res-list').innerHTML=`<div class="empty"><i class="ti ti-loader" style="font-size:20px;display:block;margin-bottom:8px;color:#4F7CFF"></i>Buscando em ${cidade}...</div>`;
  setTimeout(()=>{
    const res=Array.from({length:7},(_,i)=>({tid:'t'+Date.now()+i,nome:NF[i%NF.length]+' '+cidade.split(' ')[0],end:EF[i%EF.length]+' - '+cidade,tel:'('+(Math.floor(Math.random()*90+10))+') 9'+(Math.floor(Math.random()*9000+1000))+'-'+(Math.floor(Math.random()*9000+1000)),site:Math.random()>0.4?'https://exemplo.com':'',av:(3.5+Math.random()*1.5).toFixed(1),rev:Math.floor(Math.random()*300+5),cidade,nicho}));
    document.getElementById('res-titulo').textContent='"'+nicho+'" em '+cidade;document.getElementById('res-count').textContent=res.length+' encontrados';
    document.getElementById('res-list').innerHTML=res.map(r=>`<div style="background:rgba(10,18,34,.6);border:1px solid rgba(35,50,76,.4);border-radius:12px;padding:1rem;margin-bottom:8px;position:relative;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(79,124,255,.2),transparent)"></div><div style="font-size:14px;font-weight:700;color:#c8d4ee;margin-bottom:5px">${r.nome}</div><div style="font-size:12px;color:#2a3d56;margin-bottom:2px"><i class="ti ti-map-pin"></i> ${r.end}</div><div style="font-size:12px;color:#2a3d56;margin-bottom:2px"><i class="ti ti-phone"></i> ${r.tel}</div><div style="font-size:12px;color:#2a3d56;margin-bottom:8px"><i class="ti ti-star"></i> ${r.av} · ${r.rev} avaliações · ${r.site?'<span style="color:#1CC88A">tem site</span>':'<span style="color:#E24B4A">sem site</span>'}</div><button id="add-${r.tid}">+ Adicionar</button></div>`).join('');
    setTimeout(()=>{res.forEach(r=>{const b=document.getElementById('add-'+r.tid);if(b){b.style.cssText=S.add;b.onclick=()=>{const lead={id:nLid++,nome:r.nome,wa:r.tel.replace(/\D/g,''),email:'',insta:'',cidade:r.cidade,status:'Novo',valor:0,notas:['Nicho: '+r.nicho,'Endereço: '+r.end,'Avaliação: '+r.av+' ('+r.rev+' reviews)'+(r.site?' | Site: '+r.site:'')],data:td(),projeto:pAtivo,origem:'prospeccao',av:r.av,site:r.site};prosp[pAtivo].push(lead);leads[pAtivo].push(lead);b.style.cssText=S.ok;b.textContent='✓ Adicionado';b.disabled=true;rHist();toast('Lead adicionado à prospecção!');};};});},30);
  },1200);
}
function rHist(){const list=prosp[pAtivo];document.getElementById('hist-count').textContent=list.length+' lead(s)';document.getElementById('hist-list').innerHTML=list.length?list.slice().reverse().map(lH).join(''):`<div class="empty">Nenhum lead prospectado ainda.</div>`;}

// ============================================================
// PROJETOS
// ============================================================
function rProjs(){
  const el=document.getElementById('plist');
  if(!projs.length){el.innerHTML=`<div class="empty" style="padding:3rem">Nenhum projeto ativo ainda.<br>Clique em "+ Novo Projeto" para começar.</div>`;return;}
  el.innerHTML=projs.map(pr=>{
    const p=PD[pr.tipo];const d=dr(pr.prazo);const dc=d<7?'#E24B4A':d<14?'#F6C23E':'#1CC88A';
    const done=pr.tarefas.filter(t=>t.done).length;const prog=pr.tarefas.length?Math.round(done/pr.tarefas.length*100):0;
    return `<div class="pcard" onclick="openProj(${pr.id})"><div class="pcard-stripe" style="background:${p.cor}"></div><div style="display:flex;align-items:center;gap:9px;margin-bottom:7px"><div style="width:30px;height:30px;border-radius:8px;background:${p.bg};border:1px solid ${p.bd};display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ${p.icon}" style="color:${p.cor};font-size:14px"></i></div><div style="flex:1;min-width:0"><div class="pcard-title">${pr.cliente}</div><div class="pcard-sub">${p.nome} · ${pr.desc}</div></div><span style="font-size:11px;font-weight:700;color:${dc};flex-shrink:0">${d>0?d+'d':'Atrasado'}</span></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#2a3d56;margin-bottom:4px"><span>${done}/${pr.tarefas.length} tarefas</span><span>${prog}%</span></div><div class="prog-bar"><div class="prog-fill" style="width:${prog}%;background:${p.cor}"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#2a3d56;margin-top:5px"><span>Prazo: ${pr.prazo}</span><span style="color:${p.cor}">${fmt(pr.valor)}</span></div></div>`;
  }).join('');
}
function openProj(id){const pr=projs.find(x=>x.id===id);if(!pr)return;pAb=id;const p=PD[pr.tipo];document.getElementById('mptit').textContent=pr.cliente;document.getElementById('mpsub').innerHTML=`<i class="ti ${p.icon}" style="color:${p.cor};font-size:11px;vertical-align:-1px"></i> ${p.nome} · Prazo: ${pr.prazo}`;sPTab('visao');document.getElementById('mpbg').classList.add('open');}

function sPTab(t){
  ptAb=t;['visao','tarefas','cal','arquivos','notas'].forEach(x=>{const b=document.getElementById('pt-'+x);if(b)b.classList.toggle('active',x===t);});
  const pr=projs.find(x=>x.id===pAb);if(!pr)return;
  const p=PD[pr.tipo];const el=document.getElementById('ptcont');
  const done=pr.tarefas.filter(x=>x.done).length;const prog=pr.tarefas.length?Math.round(done/pr.tarefas.length*100):0;
  const d=dr(pr.prazo);const dc=d<7?'#E24B4A':d<14?'#F6C23E':'#1CC88A';

  if(t==='visao'){el.innerHTML=`<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:.85rem"><div class="kpi"><div class="kpi-lbl">Progresso</div><div class="kpi-val" style="color:${p.cor};font-size:17px">${prog}%</div></div><div class="kpi"><div class="kpi-lbl">Dias rest.</div><div class="kpi-val" style="color:${dc};font-size:17px">${d}</div></div><div class="kpi"><div class="kpi-lbl">Valor</div><div class="kpi-val" style="color:#1CC88A;font-size:13px">R$ ${Number(pr.valor).toLocaleString('pt-BR')}</div></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#2a3d56;margin-bottom:5px"><span>${done}/${pr.tarefas.length} tarefas</span><span>${prog}%</span></div><div class="prog-bar" style="height:5px;margin-bottom:.85rem"><div class="prog-fill" style="width:${prog}%;background:${p.cor}"></div></div><div class="sec">DESCRIÇÃO</div><div style="font-size:13px;color:#5a7090;line-height:1.6;margin-bottom:.85rem">${pr.desc}</div><div class="sec">PRÓXIMAS TAREFAS</div><div class="card">${pr.tarefas.filter(t=>!t.done).slice(0,3).map(t=>`<div class="task"><div class="chk" onclick="togTask(${pr.id},${t.id})"></div><span class="task-txt">${t.txt}</span></div>`).join('')||'<div class="empty" style="padding:.85rem">Todas concluídas! 🎉</div>'}</div>`;}

  if(t==='tarefas'){el.innerHTML=`<div class="card card-p">${pr.tarefas.map(t=>`<div class="task"><div class="chk${t.done?' done':''}" onclick="togTask(${pr.id},${t.id})">${t.done?'<i class="ti ti-check" style="font-size:10px;color:#fff"></i>':''}</div><span class="task-txt${t.done?' done':''}">${t.txt}</span></div>`).join('')||'<div class="empty" style="padding:.85rem">Nenhuma tarefa.</div>'}</div><div style="display:flex;gap:7px;margin-top:.5rem"><div class="f-wrap" style="flex:1;margin:0"><i class="ti ti-plus"></i><input class="f-inp" id="ntask" placeholder="Nova tarefa..." autocomplete="off"></div><button id="btn-at">+</button></div>`;setTimeout(()=>sb('btn-at',S.nota,'+',()=>{const i=document.getElementById('ntask');const txt=i.value.trim();if(!txt)return;const mx=pr.tarefas.length?Math.max(...pr.tarefas.map(t=>t.id)):0;pr.tarefas.push({id:mx+1,txt,done:false});i.value='';sPTab('tarefas');}),30);}

  if(t==='cal'){const now=new Date();const mes=now.getMonth();const ano=now.getFullYear();const dim=new Date(ano,mes+1,0).getDate();const fd=new Date(ano,mes,1).getDay();const mns=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];let cH='';for(let i=0;i<fd;i++)cH+='<div></div>';for(let dd=1;dd<=dim;dd++){const iT=dd===now.getDate();const ev=pr.cal.filter(e=>e.dia===dd);cH+=`<div class="cal-day${iT?' today':''}"><span class="cal-num">${dd}</span>${ev.map(e=>`<div class="cal-dot" style="background:${e.cor}" title="${e.txt}"></div>`).join('')}</div>`;}el.innerHTML=`<div style="text-align:center;font-size:12px;font-weight:700;color:#b8c8e2;margin-bottom:.6rem">${mns[mes]} ${ano}</div><div class="cal-hdr">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="cal-hd">${x}</div>`).join('')}</div><div class="cal-grid">${cH}</div><div style="margin-top:.85rem"><div class="sec">ADICIONAR EVENTO</div><div style="display:flex;gap:7px;flex-wrap:wrap"><input class="f-inp" id="cd" type="number" placeholder="Dia" min="1" max="${dim}" style="width:65px;padding:8px 10px"><div class="f-wrap" style="flex:1;min-width:100px;margin:0"><i class="ti ti-calendar"></i><input class="f-inp" id="ct" placeholder="Descrição..." autocomplete="off"></div><button id="btn-ac">+</button></div></div>`;setTimeout(()=>sb('btn-ac',S.nota,'+',()=>{const dd=parseInt(document.getElementById('cd').value);const txt=document.getElementById('ct').value.trim();if(!dd||!txt)return;pr.cal.push({dia:dd,txt,cor:p.cor});document.getElementById('cd').value='';document.getElementById('ct').value='';sPTab('cal');}),30);}

  if(t==='arquivos'){const ico={pdf:'ti-file-type-pdf',img:'ti-photo',doc:'ti-file-spreadsheet',audio:'ti-music',video:'ti-video',outro:'ti-file'};const clr={pdf:'#E24B4A',img:'#C13584',doc:'#1CC88A',audio:'#F6C23E',video:'#4F7CFF',outro:'#9B59B6'};const fList=()=>pr.arquivos&&pr.arquivos.length?pr.arquivos.map(f=>`<div class="file-item"><div class="file-ico" style="background:rgba(${f.tipo==='pdf'?'226,75,74':f.tipo==='img'?'193,53,132':f.tipo==='doc'?'28,200,138':f.tipo==='audio'?'246,194,62':'79,124,255'},.12)"><i class="ti ${ico[f.tipo]||ico.outro}" style="color:${clr[f.tipo]||clr.outro};font-size:15px"></i></div><div style="flex:1;min-width:0"><div class="file-nm">${f.nome}</div><div class="file-sz">${f.tam} · ${f.data}</div></div><button onclick="delF(${pr.id},${f.id})" style="background:none;border:none;cursor:pointer;color:#2a3d56;font-size:13px;padding:2px 6px"><i class="ti ti-trash"></i></button></div>`).join(''):`<div class="empty" style="padding:1.25rem">Nenhum arquivo ainda.</div>`;el.innerHTML=`<div class="upload-zone" onclick="document.getElementById('ufi-${pr.id}').click()"><div class="upload-ico"><i class="ti ti-cloud-upload"></i></div><div class="upload-txt">Clique para anexar<br><span>Imagens, PDFs, documentos, áudios, vídeos</span></div><input type="file" id="ufi-${pr.id}" style="display:none" multiple onchange="upFile(${pr.id},this)"></div><div id="fl-${pr.id}">${fList()}</div>`;}

  if(t==='notas'){el.innerHTML=`<div id="nl-${pr.id}">${pr.notas&&pr.notas.length?pr.notas.map((n,i)=>`<div class="note-box"><span style="flex:1">${n}</span><button onclick="delN(${pr.id},${i})" style="background:none;border:none;cursor:pointer;color:#2a3d56;font-size:13px;margin-left:8px;flex-shrink:0">✕</button></div>`).join(''):'<div class="empty" style="padding:.85rem">Nenhuma nota.</div>'}</div><div style="display:flex;gap:7px;margin-top:.6rem"><textarea class="f-ta" id="nn-${pr.id}" rows="2" placeholder="Nova nota..."></textarea><button id="btn-an">+</button></div>`;setTimeout(()=>sb('btn-an',S.nota,'+',()=>{const i=document.getElementById('nn-'+pr.id);const txt=i.value.trim();if(!txt)return;if(!pr.notas)pr.notas=[];pr.notas.push(txt);i.value='';sPTab('notas');}),30);}
}

function togTask(pid,tid){const pr=projs.find(x=>x.id===pid);if(!pr)return;const t=pr.tarefas.find(x=>x.id===tid);if(t){t.done=!t.done;sPTab(ptAb);}}
function delF(pid,fid){const pr=projs.find(x=>x.id===pid);if(!pr)return;pr.arquivos=pr.arquivos.filter(a=>a.id!==fid);sPTab('arquivos');}
function delN(pid,idx){const pr=projs.find(x=>x.id===pid);if(!pr)return;pr.notas.splice(idx,1);sPTab('notas');}
function upFile(pid,inp){const pr=projs.find(x=>x.id===pid);if(!pr)return;Array.from(inp.files).forEach(f=>{const ext=f.name.split('.').pop().toLowerCase();const tp=['jpg','jpeg','png','gif','webp','svg'].includes(ext)?'img':ext==='pdf'?'pdf':['xls','xlsx','csv','doc','docx'].includes(ext)?'doc':['mp3','wav','ogg','m4a'].includes(ext)?'audio':['mp4','mov','avi'].includes(ext)?'video':'outro';const mx=pr.arquivos&&pr.arquivos.length?Math.max(...pr.arquivos.map(a=>a.id)):0;if(!pr.arquivos)pr.arquivos=[];pr.arquivos.push({id:mx+1,nome:f.name,tipo:tp,tam:f.size>1048576?(f.size/1048576).toFixed(1)+' MB':(f.size/1024).toFixed(0)+' KB',data:td()});});sPTab('arquivos');inp.value='';toast('Arquivo anexado!');}
function createProj(){const c=document.getElementById('npc').value.trim();const e=document.getElementById('nperr');if(!c){e.textContent='Informe o cliente.';return;}e.textContent='';projs.push({id:nPid++,cliente:c,tipo:document.getElementById('npt').value,valor:document.getElementById('npv').value||0,inicio:document.getElementById('npi').value||td(),prazo:document.getElementById('npp').value||td(),desc:document.getElementById('npd').value.trim()||'Novo projeto',tarefas:[],arquivos:[],notas:[],cal:[]});cNP();rProjs();toast('Projeto criado!');}
function cNP(){document.getElementById('mnpbg').classList.remove('open');['npc','npv','npi','npp','npd'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});}

// ============================================================
// HOJE
// ============================================================
function rHoje(){const tasks=[];projs.forEach(pr=>{const p=PD[pr.tipo];pr.tarefas.filter(t=>!t.done).forEach(t=>tasks.push({proj:pr.cliente,tipo:p.nome,cor:p.cor,txt:t.txt,d:dr(pr.prazo)}));});const u=tasks.filter(t=>t.d<=3);const s=tasks.filter(t=>t.d>3&&t.d<=7);document.getElementById('h-urgente').innerHTML=u.length?u.map(t=>`<div class="today-item"><div class="today-dot" style="background:${t.cor}"></div><div><div style="font-size:13px;font-weight:600;color:#b8c8e2">${t.txt}</div><div style="font-size:11px;color:#2a3d56">${t.proj} · ${t.tipo}</div></div></div>`).join(''):`<div class="empty">Nenhuma tarefa urgente. 👍</div>`;document.getElementById('h-semana').innerHTML=s.length?s.map(t=>`<div class="today-item"><div class="today-dot" style="background:${t.cor}"></div><div><div style="font-size:13px;font-weight:600;color:#b8c8e2">${t.txt}</div><div style="font-size:11px;color:#2a3d56">${t.proj} · ${t.tipo}</div></div></div>`).join(''):`<div class="empty">Nenhuma tarefa para essa semana.</div>`;}

// ============================================================
// BOOT
// ============================================================
sb('btn-in',S.pri,'Entrar no sistema',login);
</script>
